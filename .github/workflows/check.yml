name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for tracked local files
        shell: pwsh
        run: |
          $tracked = @(git ls-files --cached --ignored --exclude-from=.gitignore)
          if ($LASTEXITCODE -ne 0) { throw 'Could not check tracked paths' }
          if ($tracked.Count) { throw 'The index contains files covered by .gitignore. Remove them from Git.' }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm audit --audit-level=moderate
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - name: Synthetic native acceptance tests, including updater build
        shell: pwsh
        run: |
          $env:PATH = "C:\Strawberry\perl\bin;" + $env:PATH
          cargo test --locked --manifest-path src-tauri/Cargo.toml --all-features
      - name: Check packaging scripts
        run: powershell -NoProfile -File scripts/Test-Scripts.ps1
      - name: Install pinned dependency checker
        run: cargo install cargo-deny --locked --version 0.20.2
      - name: Audit Rust advisories, licenses, and sources
        run: cargo deny --manifest-path src-tauri/Cargo.toml --locked check advisories licenses sources
      - name: Generate dependency notices
        run: node scripts/generate-notices.mjs
