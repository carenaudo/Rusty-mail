[package]
name = "rusty-mail"
version = "0.1.0"
edition = "2021"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
signed-updates = ["dep:tauri-plugin-updater"]

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
tauri-plugin-updater = { version = "2", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.43", default-features = false, features = ["bundled-sqlcipher-vendored-openssl", "cache", "functions"] }
keyring = { version = "3", features = ["windows-native"] }
rand = "0.8"
hex = "0.4"
sha2 = "0.10"
base64 = "0.22"
subtle = "2"
open = "5"
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "net", "io-util", "macros"] }
async-imap = { version = "0.12", default-features = false, features = ["runtime-tokio"] }
tokio-native-tls = "0.3"
native-tls = "0.2"
futures-util = "0.3"
time = { version = "0.3", features = ["formatting", "parsing"] }
percent-encoding = "2"
mail-parser = "1"
imagesize = "0.15"
lettre = { version = "0.11.24", default-features = false, features = ["builder", "smtp-transport", "native-tls"] }
rfd = "0.15"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Data_Xml_Dom", "UI_Notifications"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"

[dev-dependencies]
rcgen = "0.13"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
